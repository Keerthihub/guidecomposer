name: Signed release

# Builds and signs the .zxp on a Windows runner, so no local signing tools
# (or Rosetta on Apple Silicon Macs) are needed.
#
# One-time setup, in the GitHub repository's Settings > Secrets and variables > Actions:
#   ZXP_CERT_BASE64    your .p12 certificate, base64-encoded
#                      (macOS: base64 -i cert.p12 | pbcopy)
#   ZXP_CERT_PASSWORD  the certificate password
#
# Run it from the Actions tab (Signed release > Run workflow) or by pushing a
# tag such as v0.1.0. The signed package is attached to the run as an artifact.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checks and production build
        run: npm run build

      - name: Sign the package
        shell: pwsh
        env:
          ZXP_CERT_BASE64: ${{ secrets.ZXP_CERT_BASE64 }}
          ZXP_CERT_PASSWORD: ${{ secrets.ZXP_CERT_PASSWORD }}
        run: |
          if (-not $env:ZXP_CERT_BASE64 -or -not $env:ZXP_CERT_PASSWORD) {
            throw "Add the ZXP_CERT_BASE64 and ZXP_CERT_PASSWORD repository secrets first (see the top of this workflow file)."
          }
          $name = node -p "require('./package.json').name"
          $version = node -p "require('./package.json').version"
          $tool = Join-Path $env:RUNNER_TEMP "ZXPSignCmd.exe"
          Invoke-WebRequest "https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.103/win64/ZXPSignCmd.exe" -OutFile $tool
          $cert = Join-Path $env:RUNNER_TEMP "cert.p12"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:ZXP_CERT_BASE64))
          $out = "dist\$name-$version.zxp"
          & $tool -sign "dist\$name" $out $cert $env:ZXP_CERT_PASSWORD -tsa http://timestamp.digicert.com
          if ($LASTEXITCODE -ne 0) { throw "Signing failed" }
          & $tool -verify $out -certinfo
          if ($LASTEXITCODE -ne 0) { throw "Verification failed" }
          Remove-Item $cert
          "ZXP=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: signed-zxp
          path: ${{ env.ZXP }}
