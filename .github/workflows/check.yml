name: Check

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ES3 check and unit tests
        run: npm run check
      - name: Production build
        run: node scripts/build.js

  panel:
    name: Panel smoke test (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the panel in headless Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/ui-smoke.js --screenshots panel-screenshots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-screenshots
          path: panel-screenshots
